name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-r-imports:
    name: minimum R 4.2 with Imports only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.2.0'
          use-public-rspm: true

      - name: Install declared hard dependencies only
        shell: Rscript {0}
        run: |
          description <- read.dcf(
            "DESCRIPTION", fields = c("Depends", "Imports")
          )
          imports <- trimws(unlist(strsplit(description, ",")))
          imports <- sub("\\s*\\(.*$", "", imports)
          imports <- setdiff(imports, c("R", rownames(installed.packages())))
          if (length(imports)) install.packages(imports)

      - name: Install and run Imports-only smoke
        run: |
          R CMD INSTALL .
          Rscript tools/run-contract-60-audit.R check-output/imports-only-60.json

  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

      - name: Install checked source for installed-corpus validation
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")

      - name: Installed NGCS 1.0-2.9 conformance
        run: Rscript tools/run-installed-conformance-291.R

      - name: Stable 6.0 API contract
        run: Rscript tools/run-contract-60-audit.R

      - name: Canonical validation registry
        run: |
          Rscript tools/check-validation-registry-60.R
          Rscript tools/check-supply-chain-60.R
          Rscript tools/check-package-boundary-60.R
          Rscript tools/check-release-readiness-60.R

      - name: Public API lifecycle registry
        run: Rscript tools/check-feature-freeze-60.R

      - name: Stable API contract snapshots
        run: Rscript tools/check-api-contracts-60.R

      - name: Stable scientific inference contracts
        run: |
          Rscript tools/check-inference-contracts-60.R
          Rscript tools/check-claim-evidence-60.R

      - name: User-visible condition contracts
        run: |
          Rscript tools/check-condition-contracts-60.R
          Rscript tools/check-options-reference-60.R

      - name: Documentation and teaching corpus freshness
        run: |
          Rscript tools/check-documentation-manifest-60.R
          Rscript tools/check-stable-api-docs-60.R
          Rscript tools/check-tutorial-fixtures-60.R
          Rscript tools/check-quickstart-60.R
          Rscript tools/check-format-tutorials-60.R
          Rscript tools/check-formative-usability-60.R

      - name: Controlled user terminology
        run: Rscript tools/check-user-terminology-60.R

      - name: NGCS 2.0 support-map conformance
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: Rscript tools/run-support-map-conformance.R

  coverage:
    name: line coverage and examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: |
            any::covr
            any::jsonlite
          needs: check

      - name: Measure tests and examples
        run: Rscript tools/run-coverage-421.R coverage-421.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-421
          path: coverage-421.json

  p0-attestation:
    name: Phase 0 candidate attestation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: |
            any::jsonlite
            any::digest
          needs: check

      - name: Build and attest one clean source candidate
        run: Rscript tools/run-p0-evidence-60.R check-output/p0-evidence-60

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p0-attestation-60
          path: check-output/p0-evidence-60

  real-data-validation:
    name: real-data, cortical flatmap, and multilayer validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::jsonlite
          needs: check

      - name: Install checked source
        run: R CMD INSTALL .

      - name: Fetch checksum-pinned download-only fixtures
        run: |
          Rscript tools/fetch-reference-422.R
          Rscript tools/fetch-reference-431.R
          Rscript tools/fetch-reference-50.R

      - name: Run real-data workflows
        run: >-
          Rscript tools/run-real-data-validation-422.R
          real-data-422-validation.json

      - name: Run cortical cartography workflows
        run: >-
          Rscript tools/run-cartography-43-validation.R
          cartography-43-validation.json

      - name: Run real bilateral cortical flatmap workflow
        run: >-
          Rscript tools/run-flatmap-431-validation.R
          flatmap-431-validation.json
          .tools/reference-4.2.2
          .tools/reference-flatmap
          flatmap-431

      - name: Run real subject and support-family workflows
        run: >-
          Rscript tools/run-real-multilayer-50-validation.R
          real-multilayer-50-validation.json

      - name: Run bounded multilayer performance corpus
        run: >-
          Rscript tools/run-multilayer-50-performance.R
          multilayer-50-performance.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-data-and-cartography-validation
          path: |
            real-data-422-validation.json
            cartography-43-validation.json
            flatmap-431-validation.json
            real-multilayer-50-validation.json
            multilayer-50-performance.json
            flatmap-431/*.png

  full-performance:
    name: weekly and release full performance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::jsonlite
          needs: check

      - name: Run all seven current 6.x scale gates
        run: >-
          Rscript tools/run-full-performance.R
          check-output/full-performance-60.json

      - name: Verify full-performance artifact
        shell: Rscript {0}
        run: |
          result <- jsonlite::read_json(
            "check-output/full-performance-60.json",
            simplifyVector = TRUE
          )
          stopifnot(
            identical(result$validation, "passed"),
            length(result$cases) == 7L
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-performance-60
          path: check-output/full-performance-60.json
