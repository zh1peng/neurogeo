name: documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEUROGEO_TUTORIAL_DATA_MODE: real
      NEUROGEO_TUTORIAL_FLATMAP_CACHE: ${{ github.workspace }}/.tools/reference-flatmap
      NEUROGEO_TUTORIAL_REFERENCE50_CACHE: ${{ github.workspace }}/.tools/reference-5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::pkgdown
          needs: website

      - name: Verify documentation sources and teaching fixtures
        run: |
          Rscript tools/check-documentation-manifest-60.R
          Rscript tools/check-localization-contract-60.R
          Rscript tools/check-tutorial-fixtures-60.R
          Rscript tools/check-neuroimaging-tutorials-60.R

      - name: Fetch checksum-pinned cortical tutorial fixtures
        run: |
          Rscript tools/fetch-reference-431.R
          Rscript tools/fetch-reference-50.R

      - name: Build API reference
        shell: Rscript {0}
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install = TRUE
          )

      - name: Install neurogeo for executable tutorials
        run: R CMD INSTALL .

      - name: Render Rmd tutorials
        run: Rscript tools/render-vitepress.R

      - name: Verify neuroimaging tutorial figures
        run: Rscript tools/check-neuroimaging-tutorials-60.R --rendered

      - name: Build tutorial site
        run: |
          npm ci
          npm run docs:build

      - name: Verify documentation artifact identity
        run: Rscript tools/check-documentation-artifact-60.R

      - name: Add pkgdown API reference
        shell: bash
        run: cp -R docs website/.vitepress/dist/api

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    if: vars.NEUROGEO_ENABLE_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
