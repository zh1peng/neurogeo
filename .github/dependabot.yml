version: 2

# Keep routine dependency maintenance visible without opening one PR per
# package. Security updates remain managed by GitHub's Dependabot settings.
multi-ecosystem-groups:
  monthly-maintenance:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: monthly-maintenance
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: monthly-maintenance
