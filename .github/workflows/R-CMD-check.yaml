name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

      - name: Install checked source for installed-corpus validation
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")

      - name: Installed NGCS 1.0-2.9 conformance
        run: Rscript tools/run-installed-conformance-291.R

      - name: NGCS 2.0 support-map conformance
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: Rscript tools/run-support-map-conformance.R

  coverage:
    name: line coverage and examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::jsonlite
          needs: check

      - name: Measure tests and examples
        run: Rscript tools/run-coverage-421.R coverage-421.json

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-421
          path: coverage-421.json
